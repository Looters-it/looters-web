# Serves the SPA and forwards /api and /ws to the api service, so the browser uses one origin.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Map tiles and JSON compress well; the api sends them uncompressed.
  gzip on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types application/vnd.mapbox-vector-tile application/json application/javascript text/css image/svg+xml;

  # Resolve `api` at request time: nginx then starts even while the api is still booting.
  resolver 127.0.0.11 valid=10s;
  set $api http://api:3000;

  location /api/ {
    # Geo files are large: keep this at least as high as the api's UPLOAD_MAX_MB,
    # and stream them to the api instead of buffering them here first.
    client_max_body_size 300m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_pass $api;
    proxy_set_header Host $host;
    # Overwritten, not appended: the api trusts this header for rate limiting.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # Overwritten, not appended: the api trusts this header for rate limiting.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 1h;
  }

  location /fonts/ {
    expires 30d;
    add_header Cache-Control "public";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
